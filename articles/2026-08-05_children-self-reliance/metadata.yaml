summary: "中谷彰宏用 55 个场景化方法讲透一件事：教育不是告诉孩子正确答案，而是帮他们在心里建立一个『学生—老师』体系，让孩子自己学会反思、纠错与自立。本文回顾其核心理念，聊聊哪些放今天依然成立、哪些需要警惕。"
description: "读书笔记：《让孩子自立的55种方法》（中谷彰宏著，刘芳、江霆译，2005，当代中国出版社，ISBN 9787801703767）。全书围绕一个核心命题——教育就是让孩子成为自己的老师，通过建立自我检验、自我纠正的体系实现真正的自立，而非依赖父母与老师给出正确答案。"
