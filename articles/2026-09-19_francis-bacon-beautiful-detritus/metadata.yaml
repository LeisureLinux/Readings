summary: "FT 艺术特写《Francis Bacon's beautiful detritus》：摄影经销商 Michael Hoppen 用二十年攒下一批从培根画室地板、垃圾袋和农场拍卖会里抢救出的照片与残片，下周在纽约苏富比 Independent 20th Century 展出。本文导读并评论：培根如何把『邀请偶然』做成创作方法，Soho 的酒与争吵如何成为工作环境，以及一件东西在垃圾袋里和画廊里为何意义完全不同。"
description: "解读 FT 艺术特写《Francis Bacon's beautiful detritus》。培根 7 Reece Mews 画室的地板残渣、Michael Hoppen 的私人收藏、Soho 的 Colony Room 与 Wheeler's 聚餐（Lucian Freud、Frank Auerbach、John Deakin、Peter Beard），以及 Hoppen 关于『绅士化必有失落』『有机的圈子造不出来』的清醒反思。含『邀请偶然』作为可复用创作方法的四点启示。"
