summary: "HBR 研究（哈佛/沃顿/西北/哥伦比亚）：生成式 AI 不是创新的万能药。四阶段研究发现'天真使用'会加深四大瓶颈：创意同质化、筛选偏见、消费者模拟失真、市场反馈确认偏见。核心解法是刻意设计流程、保留人类与真实的非中介接触。"
description: "全文翻译 HBR 2026-08-14《The Innovation Problems AI Can't Solve》。提出诊断框架区分信息/人类判断/组织激励三类瓶颈，并说明 AI 在信息体量瓶颈上有效，但在扎根于人类行为与自我利益的瓶颈上可能适得其反。"
