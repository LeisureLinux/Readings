summary: "HBR 译文（Felipe A. Csaszar, Lynda Gratton 等）：AI 正在解除战略制定的‘有界理性’束缚——能生成数千战略选项、构建动态市场模型、通过模拟审议测试想法。策略建议：在下次战略会议前用 AI 拓宽选项、以动态模型替代静态快照、设计严谨测试、将战略家定义为‘架构师’。另含职业弧线三条法则：先做准备再需要、投资历久弥新的能力、保护判断时间。"
description: "全文翻译 HBR 2026-08-18《Strategy Making Gets an AI Boost》。密歇根大学 Felipe Csaszar 提出 AI 改变战略制定：替代 SWOT/五力等静态框架，生成超人类规模的选项，持续更新市场模型，避免群思与阶层压力。另包括 Lynda Gratton 的职业弧线三法则：Prepared before need, Commit to what lasts, Protect time for judgment。"
