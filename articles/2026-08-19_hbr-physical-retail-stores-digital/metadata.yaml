summary: "HBR 研究（Ayşe Çetinel、Gürhan Kök、Robert Rooderkerk）：在数字时代，成功的实体投资需要明确门店解决的‘客户问题’——不是开更多店，而是让每次到店都值得。通过对多品牌电子零售 26 个月数据的分析，发现体验型门店可提升全渠道净收入 21–27%，而便利型门店易造成线上蚕食且无增量。核心策略：停止渠道割裂核算，给门店‘定义职责’（信息搜索/即时履约/售后），按品类匹配线下价值，围绕客户价值组织。"
description: "全文翻译 HBR 2026-08-18《What Physical Retail Stores Deliver in a Digital Economy》。基于 2,388 邮编区域、450 名消费者调研、40+ 品类实证，提出实体门店应解决客户无法被线上更好完成的问题。核心结论：体验型店提升全渠道净收入 21–27%，便利型店仅蚕食而无增量；应停止按渠道拆 P&L，转以客户旅程总价值评估。"
