summary: "Brain Health, Decoded 译文：你不是懒，也不是没自制力——你是在对抗一台为劫持你生物学而造的机器。多巴胺不是快乐分子，而是'想要'；祖先寻找浆果时被随机奖励点燃的'奖励预测误差'，正是短视频与信息流赖以生存的机制。原文仅公开机制部分，译者补全可执行的注意力回收协议。"
description: "翻译并解读神经科学家 Dr. Dominic Ng《How to Stop Wasting Your Life》。拆解多巴胺的'想要/喜欢'之分与奖励预测误差（Reward Prediction Error），说明变率强化为何最难戒断，并给出'先量再断—物理隔离—固定离线时段—低刺激活动填坑'四步法与高刺激 App 判据。"
