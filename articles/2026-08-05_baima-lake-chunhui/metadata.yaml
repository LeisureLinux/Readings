description: "本文是作者 2006 年 3 月发表于旧博客 zenboy999 的一篇散文《白马湖畔的春晖》。文章以朱自清《白马湖》开篇，记叙漫步浙江上虞白马湖畔春晖中学的所见所感：夏丏尊的『平屋』、朱自清的旧居、丰子恺的『小杨柳屋』、弘一法师李叔同的『晚晴山房』，以及『北南开，南春晖』的那段群贤毕至的旧时光。"
