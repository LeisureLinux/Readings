summary: "FT 曾把一个 404 死胡同做成经济学脱口秀：用 22 个流派（滞胀、流动性陷阱、有效市场假说、马克思主义……）逐个一本正经解释「这页为啥丢了」。本文逐条解读其妙处，并扒出帕累托那条其实写错了（Hacker News 名场面），同时说明这个搞笑版在 2026 年大概率已被 Cloudflare 式验证页替换下线。"
description: "解读《金融时报》经典的 404 页面：以「我们问了几位顶尖经济学家」开场，用 22 个经济学流派/概念（滞胀、流动性陷阱、帕累托低效率、供需、凯恩斯、马尔萨斯、马克思、有效市场假说、道德风险、公地悲剧、博弈论、投机泡沫、次优理论……）一本正经地解释页面为何失踪。分析其文案为何妙（把失败场景做成品牌秀场、圈内人幽默、结构极简耐老），并补充两个彩蛋：帕累托那条定义其实写错引发 HN 挑刺；2026 年近期存档显示 FT 已换成 Cloudflare 式安全验证 404，搞笑版可能已下线。"
