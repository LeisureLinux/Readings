summary: "FDNY 中队长约翰·索卡用消防队的真实故事讲透一件事：领导不是职位，而是'第一个冲进去、最后一个撤出来'的承诺。本文梳理其『领导三角』、『追踪烟雾』、信任与执行五问等核心原则，聊聊对今天的企业管理者与危机领导力的启示。"
description: "读书笔记：《第一个冲进去，最后一个撤出来》（First In, Last Out，约翰·索卡 John Salka 与贝里特·内韦尔 Barret Neville 著，刘军译，2004，中国社会科学出版社）。作者是纽约市消防队（FDNY）中队长，亲历 1981 年爱迪生电厂大火与『9·11』救援，用 11 章讲透危机中的团队领导力：面对现实、把人当资产、培养各层级领导者、建立信任、正确决策与执行。"
